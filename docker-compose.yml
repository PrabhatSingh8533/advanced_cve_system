services:
  db:
    image: postgres:15
    container_name: cve_postgres
    restart: always
    environment:
      POSTGRES_USER: cve_user
      POSTGRES_PASSWORD: cve_password
      POSTGRES_DB: cve_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cve_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cve_user -d cve_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: cve_backend
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - cve_network
    restart: on-failure

networks:
  cve_network:
    driver: bridge

volumes:
  postgres_data:
