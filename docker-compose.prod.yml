services:
  db:
    image: postgres:15
    container_name: cve_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cve_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cve_password}
      POSTGRES_DB: ${POSTGRES_DB:-cve_db}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    networks:
      - cve_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cve_user -d cve_db"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: cve_backend_prod
    restart: always
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cve_network
    volumes:
      - model_data:/app/app/models
      - chart_data:/app/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: cve_frontend_prod
    restart: always
    networks:
      - cve_network

  nginx:
    image: nginx:alpine
    container_name: cve_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - cve_network

networks:
  cve_network:
    driver: bridge

volumes:
  postgres_data_prod:
  model_data:
  chart_data:
